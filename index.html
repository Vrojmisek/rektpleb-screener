<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REKTPLEB screener</title>
    <meta
      name="description"
      content="Personal perpetual futures screener with live public Binance and Hyperliquid data."
    />
    <meta name="theme-color" content="#10191b" />
    <link rel="icon" href="/rektpleb.svg" />
    <script>
      try {
        document.documentElement.dataset.theme =
          JSON.parse(localStorage.getItem("rektpleb-screener:theme") || '"dark"') ===
          "light"
            ? "light"
            : "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
